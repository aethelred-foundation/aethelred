name: CI
permissions:
  contents: read


on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

env:
  GO_VERSION: "1.25.8"
  RUST_VERSION: "1.85.0"

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Go vet
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(go list ./... | grep -v '/node_modules/' | grep -v '^github.com/aethelred/aethelred/app$')
          printf 'vetting %d non-app Go packages\n' "${#packages[@]}"
          (
            while true; do
              sleep 60
              printf 'go vet still running at %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          go vet -p 2 -copylocks=false "${packages[@]}"

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run non-app package tests
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(go list ./... | grep -v '/node_modules/' | grep -v '^github.com/aethelred/aethelred/app$')
          printf '%s\n' "${packages[@]}"
          go test -p 2 -timeout=180s -coverprofile=coverage.out "${packages[@]}"
      - name: Run app package smoke tests (advisory)
        continue-on-error: true
        run: |
          (
            while true; do
              sleep 60
              printf 'app package smoke tests still running at %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          timeout 140s go test -v -count=1 -timeout=120s ./app -run 'TestNewApp|TestSecureCellsHandlers_GovernmentAgentReadinessSurfaces'
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build node binary
        run: go build -v ./cmd/aethelredd/...
      - name: Build loadtest binary
        run: go build -v ./tools/tools/loadtest/...

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo fmt
        run: cargo fmt --all -- --check
        working-directory: crates
      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings -A clippy::all -W clippy::correctness -A unused_assignments
        working-directory: crates
      - name: Cargo test
        run: |
          set -euo pipefail
          # Test core protocol crates only — demo/sandbox crates are tested
          # in rust-crates-ci.yml and have environment-specific assertions
          for crate in core consensus mempool bridge vault vm; do
            echo ">>> cargo test -p aethelred-${crate}"
            cargo test -p "aethelred-${crate}"
          done
        working-directory: crates

  proto-lint:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Lint protos
        run: buf lint

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: aethelred/node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
