name: Confidential content guard

# This repository is PUBLIC. Customer-confidential material must live in the
# private pilot repository (aethelred-foundation/aethelred-m42-pilot) and must
# never reach a ref here.
#
# Written after commercial M42 material — an internal sell-side deal map, LOI
# and MOU drafts, a pre-seed investment memo, an executive offer, a pilot SOW
# and a DPIA support pack — sat on two public feature branches for four weeks
# before anyone noticed. Deleting the branches stopped it being discoverable
# but did not remove the objects: the blobs stayed fetchable by SHA through
# both the repository and its fork network, and only GitHub Support can purge
# them. The cost of catching this at push time versus after the fact is the
# reason this job exists.

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  scan:
    name: Block confidential paths and content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on confidential paths
        run: |
          set -euo pipefail

          # Paths that must never exist on a ref in the public repository.
          # Anchored where possible so source code that merely discusses a
          # regulatory concept is not caught: crates/sandbox-core/src/
          # dpia_register.rs is a GDPR Article 35 implementation and is fine.
          BLOCKED_PATHS='^M42/|^config/pilots/m42/|^\.github/workflows/m42-pilot-readiness\.yml$'

          hits="$(git ls-files | grep -E "$BLOCKED_PATHS" || true)"
          if [ -n "$hits" ]; then
            echo "::error::Confidential paths present on this ref."
            echo "$hits" | sed 's/^/  /'
            echo ""
            echo "This repository is public. Move this content to the private"
            echo "pilot repository and remove it from every ref here."
            exit 1
          fi
          echo "OK: no blocked paths."

      - name: Fail on confidential document names
        run: |
          set -euo pipefail

          # Commercial artefacts, matched by filename anywhere in the tree.
          BLOCKED_NAMES='deal-map|Pre_Seed|LOI_Draft|MOU_Draft|Investment_Memo|executive-offer|pilot-sow|target-selection|Business_Case|Differentiation_Dossier'

          hits="$(git ls-files | grep -E "$BLOCKED_NAMES" || true)"
          if [ -n "$hits" ]; then
            echo "::error::Commercial documents present on this ref."
            echo "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "OK: no blocked document names."

      - name: Fail on internal-only markers inside files
        run: |
          set -euo pipefail

          # The deal map opened with "INTERNAL ONLY — DO NOT SEND TO M42".
          # Any file carrying an explicit internal-only marker is a mistake in
          # a public repo regardless of where it sits. Restricted to text-like
          # files so binaries and vendored assets do not slow the scan.
          markers='INTERNAL ONLY|DO NOT SEND TO|CONFIDENTIAL - DO NOT|COMPANY CONFIDENTIAL'

          files="$(git ls-files -- '*.md' '*.txt' '*.rst' '*.adoc' '*.csv' '*.json' '*.yml' '*.yaml' || true)"
          [ -z "$files" ] && { echo "OK: nothing to scan."; exit 0; }

          # -I skips binary; || true so an empty result is not a failure.
          hits="$(printf '%s\n' "$files" | xargs -r grep -IlE "$markers" 2>/dev/null || true)"
          if [ -n "$hits" ]; then
            echo "::error::Files marked internal-only are present on this ref."
            echo "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "OK: no internal-only markers."
