name: Docker Build & Push

on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*", "testnet-v*", "mainnet-v*"]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aethelred-foundation/aethelred/aethelredd

jobs:
  docker-pr-verify:
    name: Verify PR Image (${{ matrix.platform }})
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build exact PR platform image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: aethelredd:ci-${{ matrix.suffix }}
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=pr-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.suffix }}

      - name: Verify production image contract
        shell: bash
        run: |
          set -euo pipefail
          image="aethelredd:ci-${{ matrix.suffix }}"
          test "$(docker image inspect "${image}" --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect "${image}" --format '{{.Config.WorkingDir}}')" = "/home/nonroot"
          if [[ "${{ matrix.platform }}" == "linux/amd64" ]]; then
            docker run --rm "${image}" version
          fi

      - name: Scan exact PR platform image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aethelredd:ci-${{ matrix.suffix }}
          scanners: vuln
          format: sarif
          output: aethelredd-${{ matrix.suffix }}-trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Upload PR image SARIF
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: aethelredd-${{ matrix.suffix }}-trivy.sarif
          category: trivy-aethelredd-pr-${{ matrix.suffix }}

      - name: Generate exact PR platform SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aethelredd:ci-${{ matrix.suffix }}
          format: cyclonedx
          output: aethelredd-${{ matrix.suffix }}.cdx.json

      - name: Retain PR image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aethelredd-pr-sbom-${{ matrix.suffix }}-${{ github.sha }}
          path: aethelredd-${{ matrix.suffix }}.cdx.json
          retention-days: 30

  docker-release-digest:
    name: Build & Scan Release Digest (${{ matrix.platform }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push untagged platform digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Keep matrix outputs as leaf manifests; signed provenance is attached
          # to the verified multi-platform index after publication.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.suffix }}

      - name: Record exact release digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Scan exact release platform digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: sarif
          output: aethelredd-${{ matrix.suffix }}-trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Upload release image SARIF
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: aethelredd-${{ matrix.suffix }}-trivy.sarif
          category: trivy-aethelredd-release-${{ matrix.suffix }}

      - name: Generate exact release platform SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: aethelredd-${{ matrix.suffix }}.cdx.json

      - name: Retain release image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aethelredd-release-sbom-${{ matrix.suffix }}-${{ github.sha }}
          path: aethelredd-${{ matrix.suffix }}.cdx.json
          retention-days: 90

      - name: Retain verified digest for manifest publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aethelredd-digest-${{ matrix.suffix }}-${{ github.sha }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish-manifest:
    name: Publish Verified Multi-Platform Manifest
    if: ${{ github.event_name != 'pull_request' }}
    needs: docker-release-digest
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aethelredd-digest-*-${{ github.sha }}
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Extract publication tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish only verified platform digests
        id: publish
        shell: bash
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -type f | sort)
          test "${#digest_files[@]}" -eq 2

          refs=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(basename "${digest_file}")"
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
            refs+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done

          mapfile -t tags < <(jq -r '.tags[]' <<< "${METADATA_JSON}")
          test "${#tags[@]}" -gt 0
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${tag}")
          done

          metadata_file="${RUNNER_TEMP}/manifest-metadata.json"
          docker buildx imagetools create \
            "${tag_args[@]}" \
            --metadata-file "${metadata_file}" \
            "${refs[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          manifest_digest="$(jq -r '."containerimage.descriptor".digest' "${metadata_file}")"
          [[ "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign GitHub build provenance for the published manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  docker-required-gate:
    name: Docker Required Gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - docker-pr-verify
    steps:
      - name: Enforce required gate status
        shell: bash
        run: |
          set -euo pipefail
          echo "docker-pr-verify=${{ needs.docker-pr-verify.result }}"
          test "${{ needs.docker-pr-verify.result }}" = "success"
