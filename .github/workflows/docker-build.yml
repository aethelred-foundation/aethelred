name: Docker Build & Push

on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*", "testnet-v*", "mainnet-v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aethelred-foundation/aethelred/aethelredd

jobs:
  docker-build:
    name: Build & Push Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build amd64 smoke image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: aethelredd:smoke-amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64

      - name: Verify amd64 runtime and metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version_output="$(docker run --rm --platform linux/amd64 aethelredd:smoke-amd64 version --long)"
          grep -Fx "name: aethelred" <<<"${version_output}"
          grep -Fx "server_name: aethelredd" <<<"${version_output}"
          grep -Fx "version: ${EXPECTED_VERSION}" <<<"${version_output}"
          grep -Fx "commit: ${EXPECTED_COMMIT}" <<<"${version_output}"
          grep -Fx "build_tags: production" <<<"${version_output}"

      - name: Build arm64 smoke image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: aethelredd:smoke-arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64

      - name: Verify arm64 runtime and metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version_output="$(docker run --rm --platform linux/arm64 aethelredd:smoke-arm64 version --long)"
          grep -Fx "name: aethelred" <<<"${version_output}"
          grep -Fx "server_name: aethelredd" <<<"${version_output}"
          grep -Fx "version: ${EXPECTED_VERSION}" <<<"${version_output}"
          grep -Fx "commit: ${EXPECTED_COMMIT}" <<<"${version_output}"
          grep -Fx "build_tags: production" <<<"${version_output}"

      - name: Build and push multiarch image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64

  docker-required-gate:
    name: Docker Required Gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - docker-build
    steps:
      - name: Enforce required gate status
        run: |
          echo "docker-build=${{ needs.docker-build.result }}"
          test "${{ needs.docker-build.result }}" = "success"
