name: Security Scans

permissions:
  contents: read

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25.12"
  RUST_VERSION: "1.85.0"
  GOFLAGS: "-mod=mod"

jobs:
  solidity-static-analysis:
    name: Solidity Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install contract dependencies
        run: npm ci --no-fund --no-audit
      - name: Slither high-severity gate
        uses: crytic/slither-action@f197989dea5b53e986d0f88c60a034ddd77ec9a8 # v0.4.0
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          solc-version: "0.8.20"
          node-version: "22"
          # crytic/slither-action v0.4.0 currently runs Python 3.9; Slither
          # 0.11.5 requires Python >=3.10 and cannot be installed in that
          # pinned action image. 0.11.4 is the newest compatible release.
          slither-version: "0.11.4"
          fail-on: high

  dependency-vuln-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go reachable-vulnerability gate
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          python3 -m unittest scripts/tests/test_validate_govulncheck.py
          report="${RUNNER_TEMP}/govulncheck.json"
          govulncheck -format=json ./... > "${report}"
          python3 scripts/validate_govulncheck.py "${report}"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-audit
        # cargo-audit 0.22.2 requires rustc 1.88. Keep the scanner compatible
        # with the repository's explicitly supported Rust 1.85 toolchain.
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Rust advisory gate
        shell: bash
        run: |
          set -euo pipefail
          lockfiles=(
            "crates/Cargo.lock"
            "sdk/rust/Cargo.lock"
            "sdk/aethelred-sdk/Cargo.lock"
            "sdk/aethelred-py/Cargo.lock"
          )
          for lockfile in "${lockfiles[@]}"; do
            echo ">>> cargo audit --file ${lockfile}"
            cargo audit --file "${lockfile}"
          done

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: NPM production dependency gate (contracts)
        working-directory: contracts
        run: |
          npm ci --no-fund --no-audit
          npm audit --omit=dev --audit-level=high

  gosec:
    name: Go Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run pinned gosec gate
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          # G104 is covered by the required errcheck lint gate. Every intentional
          # fixed-width G115 conversion is documented at the exact conversion.
          gosec -severity medium -confidence medium -exclude=G104 ./...

  trivy:
    name: Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Trivy high/critical gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: "vuln"
          format: sarif
          output: trivy-results.sarif
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: trivy-results.sarif

  gitleaks:
    name: Secret History Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          bindir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${bindir}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${bindir}" gitleaks
          echo "${bindir}" >> "${GITHUB_PATH}"
      - name: Scan complete fetched Git history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner

  security-required-gate:
    name: Security Required Gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - solidity-static-analysis
      - dependency-vuln-scan
      - gosec
      - trivy
      - gitleaks
    steps:
      - name: Enforce every security gate
        shell: bash
        run: |
          set -euo pipefail
          echo "solidity-static-analysis=${{ needs.solidity-static-analysis.result }}"
          echo "dependency-vuln-scan=${{ needs.dependency-vuln-scan.result }}"
          echo "gosec=${{ needs.gosec.result }}"
          echo "trivy=${{ needs.trivy.result }}"
          echo "gitleaks=${{ needs.gitleaks.result }}"
          test "${{ needs.solidity-static-analysis.result }}" = "success"
          test "${{ needs.dependency-vuln-scan.result }}" = "success"
          test "${{ needs.gosec.result }}" = "success"
          test "${{ needs.trivy.result }}" = "success"
          test "${{ needs.gitleaks.result }}" = "success"
