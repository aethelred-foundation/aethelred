# Aethelred gitleaks configuration.
#
# Extends the default gitleaks rules. The allowlist below is a curated set of
# reviewed exceptions — each has been inspected and confirmed NOT to be a real
# secret.
#
# Pilot-specific allowlist entries are deliberately absent: those paths exist
# only in the private pilot repository, so carrying them here would be dead
# configuration that also discloses a customer relationship. Keep pilot
# exceptions in the pilot repository's own config.

title = "Aethelred gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Reviewed non-secrets: public cryptographic evidence, synthetic fixtures, and well-known public test keys."

paths = [
  # Compiled bytecode and caches (gitignored).
  '''.*__pycache__/.*''',
  '''.*\.pyc$''',
]
