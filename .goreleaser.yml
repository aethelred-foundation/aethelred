version: 2

project_name: aethelred

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: aethelredd
    main: ./cmd/aethelredd
    binary: aethelredd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -tags=production,pqc_circl
    ldflags:
      - -s -w
      - -X github.com/aethelred/aethelred/version.Version={{.Version}}
      - -X github.com/aethelred/aethelred/version.Commit={{.Commit}}
      - -X github.com/aethelred/aethelred/version.BuildDate={{.Date}}

  - id: aethel
    main: ./tools/cli/aethel
    binary: aethel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

sboms:
  - artifacts: archive
    cmd: syft

release:
  github:
    owner: aethelred-foundation
    name: aethelred
  draft: false
  prerelease: auto
  header: |
    ## Aethelred {{ .Tag }}

    See [CHANGELOG.md](https://github.com/aethelred-foundation/aethelred/blob/main/CHANGELOG.md) for full details.

  name_template: "{{.ProjectName}} {{.Tag}}"

# Container tags are published exclusively by docker-build.yml after each
# platform digest passes its vulnerability scan. Keeping container publication
# out of GoReleaser prevents tag races and ensures testnet tags cannot promote
# an unverified image to the production `latest` channel.
