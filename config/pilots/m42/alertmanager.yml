global:
  resolve_timeout: 5m

route:
  receiver: m42-local-webhook
  group_by: ['alertname', 'severity', 'sandbox']
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h

receivers:
  - name: m42-local-webhook
    webhook_configs:
      - url: http://m42-alert-webhook:5678/
        send_resolved: true
