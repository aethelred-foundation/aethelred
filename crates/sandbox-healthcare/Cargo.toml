[package]
name = "aethelred-sandbox-healthcare"
version = "0.2.0"
edition = "2021"
authors = ["Aethelred Team"]
description = "Aethelred Infinity Sandbox — Healthcare AI Assurance. Genomics, clinical AI, ambient documentation, and claims adjudication with FHIR R4 / HL7 v2 / DICOM alignment and DoH / DHA / MOHAP / EHS / HIPAA / EU AI Act regulator views."
license = "Apache-2.0"
repository = "https://github.com/aethelred/aethelred-mvp"
keywords = ["sandbox", "healthcare", "ai", "fhir", "genomics"]
categories = ["development-tools::testing", "simulation"]

[features]
default = []
async = ["aethelred-sandbox-core/async"]

[dependencies]
aethelred-sandbox-core = { path = "../sandbox-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.20", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
proptest = "1.6"

[lints]
workspace = true
