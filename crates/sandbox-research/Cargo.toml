[package]
name = "aethelred-sandbox-research"
version = "0.2.0"
edition = "2021"
authors = ["Aethelred Team"]
description = "Aethelred Infinity Sandbox — Research Reproducibility. Experiment runs, model release, reproducibility packs, training-run lineage. MLflow / W&B / DVC / Hugging Face / RO-Crate / FAIR / NeurIPS / MLPerf."
license = "Apache-2.0"
repository = "https://github.com/aethelred/aethelred-mvp"
keywords = ["sandbox", "research", "mlops", "fair", "reproducibility"]
categories = ["development-tools::testing", "simulation"]

[features]
default = []
async = ["aethelred-sandbox-core/async"]

[dependencies]
aethelred-sandbox-core = { path = "../sandbox-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.20", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
proptest = "1.6"

[lints]
workspace = true
