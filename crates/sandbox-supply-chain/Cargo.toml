[package]
name = "aethelred-sandbox-supply-chain"
version = "0.2.0"
edition = "2021"
authors = ["Aethelred Team"]
description = "Aethelred Infinity Sandbox — Supply Chain Integrity. Batch traceability, customs filing, carbon lifecycle, and methane/flaring evidence. GS1 EPCIS 2.0 / OPC-UA / IEC 61850 / Maqta. EU CBAM / EU Methane / US 45V / ISSB / GHG Protocol."
license = "Apache-2.0"
repository = "https://github.com/aethelred/aethelred-mvp"
keywords = ["sandbox", "supply-chain", "cbam", "methane", "epcis"]
categories = ["development-tools::testing", "simulation"]

[features]
default = []
async = ["aethelred-sandbox-core/async"]

[dependencies]
aethelred-sandbox-core = { path = "../sandbox-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.20", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }

[dev-dependencies]
serde_json = "1.0"
proptest = "1.6"

[lints]
workspace = true
