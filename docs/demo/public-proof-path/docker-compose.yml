services:
  public-proof-path:
    build:
      context: .
    container_name: aethelred-public-proof-path
    environment:
      AETHELRED_PROOF_HOST: 0.0.0.0
      AETHELRED_PROOF_PORT: "8088"
      AETHELRED_PROOF_OUTPUT_DIR: /data
      AETHELRED_AUTO_RUN: "1"
    ports:
      - "8088:8088"
    volumes:
      - ./out:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
