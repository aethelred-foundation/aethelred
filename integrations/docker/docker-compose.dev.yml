# Aethelred Local Development Environment (DEV ONLY)
# SECURITY: This file intentionally enables mock/simulated execution for local testing.
# A pre-provisioned development node home is still required; see README.md.

services:
  aethelred-node:
    image: ghcr.io/aethelred-foundation/aethelred/aethelredd:latest
    build:
      context: ../..
      dockerfile: integrations/docker/Dockerfile.node
    container_name: aethelred-node
    command:
      - start
      - --home=/root/.aethelred
      - --moniker=${AETHELRED_DEV_MONIKER:-local-validator}
      - --rpc.laddr=tcp://0.0.0.0:26657
      - --p2p.laddr=tcp://0.0.0.0:26656
      - --api.enable=true
      - --api.address=tcp://0.0.0.0:1317
      - --api.enabled-unsafe-cors=false
      - --grpc.enable=true
      - --grpc.address=0.0.0.0:9090
      - --grpc-web.enable=true
      - --log_level=${AETHELRED_LOG_LEVEL:-debug}
    ports:
      - "26656:26656"
      - "127.0.0.1:26657:26657"
      - "127.0.0.1:1317:1317"
      - "127.0.0.1:9090:9090"
    expose:
      - "26660"
    volumes:
      - type: bind
        source: "${AETHELRED_DEV_NODE_HOME:?set AETHELRED_DEV_NODE_HOME to an absolute, initialized development node home}"
        target: /root/.aethelred
        bind:
          create_host_path: false
    environment:
      AETHELRED_CHAIN_ID: "${AETHELRED_DEV_CHAIN_ID:-aethelred-local}"
      AETHELRED_MONIKER: "${AETHELRED_DEV_MONIKER:-local-validator}"
      AETHELRED_LOG_LEVEL: "${AETHELRED_LOG_LEVEL:-debug}"
      AETHELRED_TEE_MODE: "nitro-simulated"
      AETHELREDD_INSTRUMENTATION_PROMETHEUS: "true"
      AETHELREDD_INSTRUMENTATION_PROMETHEUS_LISTEN_ADDR: "0.0.0.0:26660"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:26657/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aethelred-network

  tee-worker:
    image: aethelred/tee-worker:latest
    build:
      context: ../..
      dockerfile: integrations/docker/Dockerfile.tee-worker
    container_name: aethelred-tee-worker
    ports:
      - "127.0.0.1:8545:8545"
    environment:
      TEE_MODE: mock
      AETHELRED_TEE_LISTEN_ADDR: "0.0.0.0:8545"
      AETHELRED_TEE_API_TOKEN: "${AETHELRED_TEE_API_TOKEN:-dev-only-change-me}"
      AETHELRED_ALLOW_SIMULATED: "true"
      AETHELRED_TEE_SUPPORTS_ZKML: "true"
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8545/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aethelred-network

  zkml-prover:
    image: aethelred/zkml-prover:latest
    build:
      context: ../..
      dockerfile: integrations/docker/Dockerfile.zkml
    container_name: aethelred-zkml-prover
    ports:
      - "127.0.0.1:8546:8546"
    environment:
      PROVER_MODE: development
      AETHELRED_ZKML_LISTEN_ADDR: "0.0.0.0:8546"
      AETHELRED_ZKML_API_TOKEN: "${AETHELRED_ZKML_API_TOKEN:-dev-zkml-only-change-me}"
      AETHELRED_ALLOW_SIMULATED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8546/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aethelred-network

  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    container_name: aethelred-prometheus
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - aethelred-network

volumes:
  prometheus-data:

networks:
  aethelred-network:
    driver: bridge
