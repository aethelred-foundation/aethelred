# Aethelred production deployment.
#
# This profile deliberately has no generated genesis or simulated backends.
# See README.md for the required pre-provisioned node home, public HTTPS
# endpoints, backend services, bearer tokens, and TLS reverse proxy.

services:
  aethelred-node:
    image: ghcr.io/aethelred-foundation/aethelred/aethelredd:latest
    build:
      context: ../..
      dockerfile: integrations/docker/Dockerfile.node
    container_name: aethelred-node
    command:
      - start
      - --home=/root/.aethelred
      - --moniker=${AETHELRED_MONIKER:?set AETHELRED_MONIKER to this production node's moniker}
      - --rpc.laddr=tcp://0.0.0.0:26657
      - --p2p.laddr=tcp://0.0.0.0:26656
      - --api.enable=true
      - --api.address=tcp://0.0.0.0:1317
      - --api.enabled-unsafe-cors=false
      - --grpc.enable=true
      - --grpc.address=0.0.0.0:9090
      - --grpc-web.enable=true
      - --log_level=${AETHELRED_LOG_LEVEL:-info}
    ports:
      - "26656:26656"            # P2P is intentionally public.
      - "127.0.0.1:26657:26657"  # RPC: publish through an authenticated proxy if needed.
      - "127.0.0.1:1317:1317"    # REST/gRPC-Web.
      - "127.0.0.1:9090:9090"    # Native gRPC.
    expose:
      - "26660"                  # CometBFT metrics, observability network only.
    volumes:
      - type: bind
        source: "${AETHELRED_NODE_HOME:?set AETHELRED_NODE_HOME to an absolute, pre-provisioned validator home}"
        target: /root/.aethelred
        bind:
          create_host_path: false
    environment:
      AETHELRED_CHAIN_ID: "${AETHELRED_CHAIN_ID:?set AETHELRED_CHAIN_ID to the chain ID in genesis.json}"
      AETHELRED_MONIKER: "${AETHELRED_MONIKER:?set AETHELRED_MONIKER to this production node's moniker}"
      AETHELRED_LOG_LEVEL: "${AETHELRED_LOG_LEVEL:-info}"
      AETHELRED_TEE_MODE: "remote"
      AETHELRED_TEE_ENDPOINT: "${AETHELRED_TEE_ENDPOINT:?set AETHELRED_TEE_ENDPOINT to the public HTTPS TEE worker base URL}"
      AETHELRED_ATTESTATION_VERIFIER_ENDPOINT: "${AETHELRED_ATTESTATION_VERIFIER_ENDPOINT:?set AETHELRED_ATTESTATION_VERIFIER_ENDPOINT to the public HTTPS attestation verifier base URL}"
      AETHELRED_PROVER_ENDPOINT: "${AETHELRED_PROVER_ENDPOINT:?set AETHELRED_PROVER_ENDPOINT to the public HTTPS zkML prover base URL}"
      AETHELRED_TEE_API_TOKEN: "${AETHELRED_TEE_API_TOKEN:?set AETHELRED_TEE_API_TOKEN to a strong random value}"
      AETHELRED_ZKML_API_TOKEN: "${AETHELRED_ZKML_API_TOKEN:?set AETHELRED_ZKML_API_TOKEN to a strong random value}"
      AETHELREDD_INSTRUMENTATION_PROMETHEUS: "true"
      AETHELREDD_INSTRUMENTATION_PROMETHEUS_LISTEN_ADDR: "0.0.0.0:26660"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:26657/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - aethelred-network
      - observability-network

  tee-worker:
    image: aethelred/tee-worker:latest
    build:
      context: ../..
      dockerfile: integrations/docker/Dockerfile.tee-worker
    container_name: aethelred-tee-worker
    ports:
      - "127.0.0.1:8545:8545"
    environment:
      TEE_MODE: production
      AETHELRED_TEE_LISTEN_ADDR: "0.0.0.0:8545"
      AETHELRED_TEE_API_TOKEN: "${AETHELRED_TEE_API_TOKEN:?set AETHELRED_TEE_API_TOKEN to a strong random value}"
      AETHELRED_TEE_BACKEND_URL: "${AETHELRED_TEE_BACKEND_URL:?set AETHELRED_TEE_BACKEND_URL to the real public HTTPS TEE backend base URL}"
      AETHELRED_TEE_BACKEND_API_TOKEN: "${AETHELRED_TEE_BACKEND_API_TOKEN:?set AETHELRED_TEE_BACKEND_API_TOKEN to the real TEE backend bearer token}"
      AETHELRED_ALLOW_SIMULATED: "false"
      AETHELRED_TEE_SUPPORTS_ZKML: "true"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8545/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aethelred-network
      - observability-network

  zkml-prover:
    image: aethelred/zkml-prover:latest
    build:
      context: ../..
      dockerfile: integrations/docker/Dockerfile.zkml
    container_name: aethelred-zkml-prover
    ports:
      - "127.0.0.1:8546:8546"
    environment:
      PROVER_MODE: production
      AETHELRED_ZKML_LISTEN_ADDR: "0.0.0.0:8546"
      AETHELRED_ZKML_API_TOKEN: "${AETHELRED_ZKML_API_TOKEN:?set AETHELRED_ZKML_API_TOKEN to a strong random value}"
      AETHELRED_ZKML_BACKEND_URL: "${AETHELRED_ZKML_BACKEND_URL:?set AETHELRED_ZKML_BACKEND_URL to the real public HTTPS prover backend base URL}"
      AETHELRED_ZKML_BACKEND_API_TOKEN: "${AETHELRED_ZKML_BACKEND_API_TOKEN:?set AETHELRED_ZKML_BACKEND_API_TOKEN to the real zkML backend bearer token}"
      AETHELRED_ALLOW_SIMULATED: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8546/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aethelred-network
      - observability-network

  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    container_name: aethelred-prometheus
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - observability-network

volumes:
  prometheus-data:

networks:
  aethelred-network:
    driver: bridge
  observability-network:
    driver: bridge
    internal: true
